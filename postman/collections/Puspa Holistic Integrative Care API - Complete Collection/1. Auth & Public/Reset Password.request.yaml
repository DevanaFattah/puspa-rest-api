$kind: http-request
url: http://127.0.0.1:8000/api/v1/auth/reset-password
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
        "token": "RESET_TOKEN_HERE",
        "email": "user@example.com",
        "password": "newpassword",
        "password_confirmation": "newpassword"
    }
auth:
  type: noauth
order: 6000
